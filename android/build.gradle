group 'com.simform.audio_waveforms'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.8.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

def isAgp9OrAbove = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0].toInteger() >= 9
def builtInKotlinProp = project.findProperty('android.builtInKotlin')
def useBuiltInKotlin = isAgp9OrAbove && (builtInKotlinProp == null || builtInKotlinProp.toString().toBoolean())

apply plugin: 'com.android.library'
if (!useBuiltInKotlin) {
    apply plugin: 'kotlin-android'
}

android {
    if (project.android.hasProperty("namespace")) {
        namespace "com.simform.audio_waveforms"
    }

    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    if (!useBuiltInKotlin) {
        kotlinOptions {
            jvmTarget = '1.8'
        }
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 21
    }
}

dependencies {
    implementation("androidx.multidex:multidex:2.0.1")
    implementation "com.google.android.exoplayer:exoplayer:2.17.1"
}
